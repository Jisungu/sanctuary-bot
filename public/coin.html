<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sanctuaire - Tirage au Sort</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Montserrat:wght@600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Cinzel', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        .toss-container {
            opacity: 0;
            visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s ease-in-out;
            position: relative;
        }

        .toss-container.visible {
            opacity: 1;
            visibility: visible;
        }

        /* Halo de Cosmos géant en arrière-plan */
        .cosmos-aura {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(241, 196, 15, 0.3) 0%, rgba(230, 126, 34, 0.15) 50%, rgba(0, 0, 0, 0) 75%);
            animation: pulseAura 3s infinite alternate ease-in-out;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes pulseAura {
            0% { transform: scale(0.9); opacity: 0.6; }
            100% { transform: scale(1.25); opacity: 1; }
        }

        /* Grande scène 3D spectaculaire */
        .coin-scene {
            width: 380px;
            height: 380px;
            perspective: 1200px;
            margin-bottom: 35px;
            z-index: 2;
        }

        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateY(0deg);
        }

        .coin.flipping {
            animation: flipCoin 3s cubic-bezier(0.15, 0.85, 0.35, 1.05) forwards;
        }

        /* Design de la pièce d'Or du Sanctuaire */
        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            border: 12px solid #f1c40f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.95), 0 0 15px rgba(241, 196, 15, 0.8);
            box-shadow: 
                0 0 50px rgba(241, 196, 15, 0.8),
                inset 0 0 40px rgba(0, 0, 0, 0.8),
                inset 0 0 15px rgba(255, 235, 150, 0.9);
            background: 
                radial-gradient(circle, rgba(255,215,0,0.9) 0%, rgba(184,134,11,0.95) 70%, rgba(120,80,0,1) 100%),
                repeating-conic-gradient(rgba(255,255,255,0.1) 0deg 15deg, transparent 15deg 30deg);
            padding: 20px;
            box-sizing: border-box;
        }

        /* Anneau décoratif interne de l'Horloge */
        .coin-face::before {
            content: '';
            position: absolute;
            width: 84%;
            height: 84%;
            border-radius: 50%;
            border: 3px dashed rgba(255, 235, 170, 0.7);
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }

        .coin-text {
            font-size: 32px;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 3;
            max-width: 90%;
            word-wrap: break-word;
            line-height: 1.2;
        }

        .coin-subtext {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #fce881;
            letter-spacing: 4px;
            margin-top: 8px;
            text-transform: uppercase;
            z-index: 3;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .coin-back {
            transform: rotateY(180deg);
        }

        /* Animation de rotation et bond spectaculaire */
        @keyframes flipCoin {
            0% { 
                transform: rotateY(0deg) translateY(0) scale(0.8); 
            }
            40% { 
                transform: rotateY(2160deg) translateY(-140px) scale(1.35); 
            }
            100% { 
                transform: rotateY(var(--final-rotation)) translateY(0) scale(1); 
            }
        }

        /* Bannière du décret du Grand Pope */
        .result-card {
            z-index: 2;
            background: linear-gradient(135deg, rgba(15, 15, 25, 0.96) 0%, rgba(30, 25, 15, 0.96) 100%);
            border: 3px solid #f1c40f;
            border-radius: 16px;
            padding: 25px 45px;
            max-width: 700px;
            box-shadow: 0 0 40px rgba(230, 126, 34, 0.7), inset 0 0 15px rgba(241, 196, 15, 0.3);
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: opacity 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .result-card.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .result-title {
            font-size: 30px;
            color: #f1c40f;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
            text-shadow: 0 0 15px #e67e22, 0 2px 4px rgba(0,0,0,0.8);
            border-bottom: 2px solid rgba(241, 196, 15, 0.5);
            padding-bottom: 10px;
        }

        .result-body {
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            color: #f5f5f5;
            line-height: 1.5;
            font-weight: 600;
        }

        .team-highlight {
            color: #f39c12;
            font-weight: 800;
            font-size: 26px;
            text-shadow: 0 0 12px rgba(243, 156, 18, 0.9);
        }
    </style>
</head>
<body>

    <div class="toss-container" id="tossContainer">
        <div class="cosmos-aura"></div>
        <div class="coin-scene">
            <div class="coin" id="coin">
                <div class="coin-face coin-front">
                    <div class="coin-text" id="faceFront">TEAM 1</div>
                    <div class="coin-subtext">Sanctuaire</div>
                </div>
                <div class="coin-face coin-back">
                    <div class="coin-text" id="faceBack">TEAM 2</div>
                    <div class="coin-subtext">Sanctuaire</div>
                </div>
            </div>
        </div>
        <div class="result-card" id="resultCard">
            <div class="result-title">Décret du Grand Pope</div>
            <div class="result-body" id="resultText"></div>
        </div>
    </div>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}`);

        const container = document.getElementById('tossContainer');
        const coin = document.getElementById('coin');
        const faceFront = document.getElementById('faceFront');
        const faceBack = document.getElementById('faceBack');
        const resultCard = document.getElementById('resultCard');
        const resultText = document.getElementById('resultText');

        let hideTimeout = null;

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === 'toss_triggered') {
                const { team1, team2, designatedTeam } = data;

                if (hideTimeout) clearTimeout(hideTimeout);

                faceFront.innerText = team1.toUpperCase();
                faceBack.innerText = team2.toUpperCase();

                resultCard.classList.remove('show');
                coin.classList.remove('flipping');
                
                container.classList.add('visible');

                void coin.offsetWidth;

                const isTeam1Winner = designatedTeam === team1;
                // 12 tours complets (4320deg) pour Team 1, +180deg (4500deg) pour Team 2
                const finalRotation = isTeam1Winner ? 4320 : 4500; 
                coin.style.setProperty('--final-rotation', `${finalRotation}deg`);
                coin.classList.add('flipping');

                setTimeout(() => {
                    const teamHighlight = document.createElement('span');
                    teamHighlight.className = 'team-highlight';
                    teamHighlight.textContent = designatedTeam;
                    resultText.replaceChildren(
                        "C'est l'équipe ",
                        teamHighlight,
                        " qui doit envoyer son premier Chevalier dans l'arène"
                    );
                    resultCard.classList.add('show');
                }, 3000);

                hideTimeout = setTimeout(() => {
                    resultCard.classList.remove('show');
                    container.classList.remove('visible');
                }, 8500);
            }
        };
    </script>
</body>
</html>
